services:
  flask-api:
    depends_on: 
      - mysql
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qcyber_flask_api
    restart: always
    env_file:
      - .env
    ports:
      - "${FLASK_API_PORT:?error}:${FLASK_API_PORT}"
    environment:
       - MYSQL_HOST=mysql  # sobreescrita
       - MYSQL_PORT=3306  # sobreescrita
    networks:
      - qcyber-network

  
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: qcyber_ollama
    volumes:
      - ./ollama:/root/.ollama
      - ./entrypoint.ollama.sh:/entrypoint.ollama.sh
    ports:
      - 11434:11434
    entrypoint: ["/bin/bash", "/entrypoint.ollama.sh"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - qcyber-network

  mysql:
    image: mysql:9.4.0
    container_name: qcyber_mysql
    restart: always
    env_file:
      - .env
    volumes:
      - ./mysql_volume:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-50000}:3306"
    networks:
      - qcyber-network



networks:
  qcyber-network:
    driver: bridge
