[project]
name = "qml"
version = "0.1.0"
description = "QML - CrewAI"
authors = [{ name = "Felipe Cordeiro", email = "imfelipe.cordeiro12@gmail.com" }]
requires-python = ">=3.11, <=3.13"
dependencies = [
    "anyio>=4.10.0",
    "crewai[tools]>=0.186.1",
    "flask>=3.1.2",
    "flask-cors>=6.0.1",
    "flask-mysql>=1.6.0",
    "flask-mysqldb>=2.0.0",
    "joblib>=1.5.2",
    "langchain-anthropic>=0.3.20",
    "langchain-community>=0.3.29",
    "langchain-ollama>=0.3.8",
    "langgraph>=0.6.7",
    "matplotlib>=3.10.6",
    "mysql>=0.0.3",
    "mysql-connector-python>=9.4.0",
    "pandas>=2.3.2",
    "pennylane>=0.42.3",
    "pymysql>=1.1.2",
    "python-dotenv>=1.1.1",
    "scikit-learn==1.6.1",
]

[project.scripts]
run_crew = "qml.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[dependency-groups]
dev = [
    "jupyterlab>=4.4.7",
]
