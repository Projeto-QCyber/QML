final_evaluation_task:
  description: >
    You have been provided with the binary votes and justifications from all 14
    cybersecurity specialists for the same 20 samples. Your job is to evaluate
    their decisions, compare consistency, and decide the most appropriate final
    classification for each sample.
  expected_output: >
    JSON with two keys:
    - "predictions": array of 20 final labels among
      ["MITM","Fingerprinting","Ransomware","Uploading","SQL_injection",
       "DDoS_HTTP","DDoS_TCP","Password","Port_Scanning","Vulnerability_scanner",
       "Backdoor","XSS","DDoS_UDP","DDoS_ICMP"] in the same order as input samples.
    - "report": short rationale (3-6 sentences) explaining how conflicts were resolved.
  agent: cybersecurity_team_leader