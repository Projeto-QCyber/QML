final_evaluation_task:
  description: >
    You have been provided with the outputs of all 14 specialists for the same 1 samples.
    Each specialist returns a JSON object with:
    - "votes": binary array (1 if the model's predicted_label equals the specialist's class, else 0)
    - "predicted_labels": the raw multiclass labels (0–13) for each sample
    - "notes": short per-sample observations (optional but recommended), grounded in raw fields
      from the input samples when possible (e.g., TCP flags, port ranges, methods, URIs).

    ADDITIONAL CONTEXT: A SHAP (SHapley Additive exPlanations) analysis was run on the sample,
    providing the feature importance for the model's prediction. You MUST use this information 
    to enrich your final report, explaining WHY the model made its decision.
    
    SHAP EXPLANATION:
    ---
    {shap_explanation}
    ---

    PROBABILITY CONTEXT:
    ---
    {probability_context}
    ---

    You MUST use the probability context when deciding whether to accept the
    multiclass label or reject the classification for specialist review.
    If the multiclass confidence is below "min_confidence", return prediction 99.
    If specialist votes disagree with the probability model, return prediction 99
    unless there is a clear, evidence-based reason in the notes to override it.
    Explain the probability/confidence rationale in the report.

    For each sample:
    (1) Inspect which specialists voted 1 and read their notes;
    (2) Compare the votes with the probability context;
    (3) If confidence is below threshold or evidence conflicts, return 99;
    (4) If exactly one specialist voted 1 and probability context supports it, select that class;
    (5) If none voted 1, return 99 instead of forcing a class.
    Write a concise rationale explaining any non-trivial tie-breaks.
  expected_output: >
    JSON with:
    - "predictions": array of 1 final integer labels. Use 99 for rejection/specialist review.
    - "report": 3–6 sentences summarizing the audit process, probability/confidence, and
      whether the result was accepted or rejected for specialist review.
  agent: cybersecurity_team_leader
