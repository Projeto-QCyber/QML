analyze_and_vote_mitm:
  description: >
    You have been provided with a list of 20 network data samples: {samples}.
    Use the 'Model' tool to analyze the entire batch for Man-in-the-Middle (MITM) attack patterns.
    Pass the complete list of samples directly to the 'samples' parameter of the tool.
  expected_output: >
    A list of 20 binary votes (1 for MITM attack, 0 for other attack), one for each sample.
    Example: [1, 0, 1, ..., 0, 1]
  agent: cybersecurity_specialist_mitm

