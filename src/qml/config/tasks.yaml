analyze_and_vote_1:
 description: >
      Analyze the 10 network data samples provided. Use your prediction tool
      to vote on whether each sample represents a cyberattack. The vote should
      be binary: 1 for attack, 0 for normal.
      The data for analysis is: {argument}
 expected_output: >
      A list of 10 binary votes, one for each sample. Example: \n
      [1, 0, 1, 1, 0, 0, 1, 0, 0, 1]
  
 agent: cybersecurity_analyst_1

analyze_and_vote_2:
 description: >
      Analyze the 10 network data samples provided independently.
      Use your prediction tool to vote on whether each sample represents a cyberattack.
      The vote must be binary: 1 for attack, 0 for normal.
      The data for analysis is: {argument}
 expected_output: >
      A list of 10 binary votes, one for each sample. Example: [1, 0, 1, 1, 0, 0, 1, 0, 0, 1]
 agent: cybersecurity_analyst_2

validate_results:
 description: >
      You have received the votes of two analysts on whether 10 samples of
      network data represent a cyberattack.
      
      The first analyst's votes are: {analyst_1_votes}.
      The second analyst's votes are: {analyst_2_votes}.
      
      Analyze the votes and issue a final verdict for each of the 10 samples.
      If the two votes agree, use the consensus. If there is disagreement, use 
      your own expert judgment to decide the outcome.
 expected_output: >
      A list of 10 final binary votes, one for each sample. Example: [1, 0, 1, 1, 0, 0, 1, 0, 0, 1]
 agent: cybersecurity_specialist