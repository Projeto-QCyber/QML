analyze_and_vote_1:
  description: >
    You are an AI agent analyzing network traffic samples.
    You are provided with EXACTLY this JSON array of 5 samples:
    {samples}

    You may call one or both available tools: "Model" and "quantum_model".
    Decide if and when to use each tool.
    If you call a tool, use arguments as a JSON OBJECT (not a string):
    {"samples": <the JSON array above>}

    Strict rules for the tool call:
    - Pass a JSON object, not a quoted string. Do NOT wrap the arguments in quotes or backticks.
    - Pass ONLY the samples array under the key "samples". Do NOT include labels or any extra arrays.
    - Do NOT reformat or alter the samples in any way.
    - Return ONLY a final list of 5 binary votes (0/1), e.g. [0,1,0,1,0].
  expected_output: >
    A list of 5 binary votes (0 or 1).
  agent: cybersecurity_analyst_1

analyze_and_vote_2:
  description: >
    You are an AI agent independently analyzing the SAME 5 samples:
    {samples}

    You may call one or both available tools: "Model" and "quantum_model".
    Decide if and when to use each tool.
    If you call a tool, use arguments as a JSON OBJECT (not a string):
    {"samples": <the JSON array above>}

    Strict rules for the tool call:
    - Pass a JSON object, not a quoted string. Do NOT wrap the arguments in quotes or backticks.
    - Pass ONLY the samples array under the key "samples". Do NOT include labels or any extra arrays.
    - Do NOT modify the data in any way.
    - Return ONLY a final list of 5 binary votes (0/1), e.g. [1,0,0,1,1].
  expected_output: >
    A list of 5 binary votes (0 or 1).
  agent: cybersecurity_analyst_2


validate_results:
  description: >
    You are a senior cybersecurity specialist. You have received votes from two junior analysts on 5 data samples.
    - Analyst 1 votes: {analyze_and_vote_1.output}
    - Analyst 2 votes: {analyze_and_vote_2.output}

    Your task is to analyze their votes and provide a final verdict.
    - If both analysts agree, accept their consensus.
    - If they disagree, use your expert judgment.
    - Respond STRICTLY in JSON with a key "predictions" containing ONLY the list of final binary votes.
    - Do not include any extra text outside of the JSON.

  expected_output: >
    ```json
    {
      "predictions": [0/1,...]
    }
    ```
  agent: cybersecurity_specialist

