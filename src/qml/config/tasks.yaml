analyze_and_vote_1:
  description: >
    You have been provided with a list of 1 network data samples: {samples}.
    Use the 'Model' tool to get predictions for the entire batch of samples at once.
    Pass the complete list of samples directly to the 'samples' parameter of the tool.
  expected_output: >
    A list of 1 binary votes, one for each sample, as returned from the tool.
    Example: [1, 0, 1, ..., 0, 1]
  agent: cybersecurity_analyst_1

analyze_and_vote_2:
  description: >
    You have been provided with a list of 1 network data samples for independent analysis: {samples}.
    Use the 'Model' tool to get predictions for the entire batch of samples at once.
    Pass the complete list of samples directly to the 'samples' parameter of the tool.
  expected_output: >
    A list of 1 binary votes, one for each sample, as returned from the tool.
    Example: [1, 0, 1, ..., 0, 1]
  agent: cybersecurity_analyst_2

validate_results:
 description: >
    You have received the votes of two analysts on whether 1 samples of
    network data represent a cyberattack.
    
    The first analyst's votes are: {analyst_1_votes}.
    The second analyst's votes are: {analyst_2_votes}.
    
    Analyze the votes and issue a final verdict for each of the 1 samples.
    If the two votes agree, use the consensus. If there is disagreement, use 
    your own expert judgment to decide the outcome.
 expected_output: >
    A list of 1 final binary votes, one for each sample and a report. Example: 
    predictions: [1, 0, 1, ..., 0, 1]
    report: "Analyst 1 and Analyst 2 agreed on samples 1, 3, and 5. Disagreement on samples 2 and 4."
 agent: cybersecurity_specialist