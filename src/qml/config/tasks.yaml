analyze_and_vote_1:
  description: >
    You are an AI agent analyzing network traffic samples.
    You are provided with EXACTLY this JSON array of 5 samples:
    {samples}

    Your job is ONLY to call the tool "Model" with arguments as a JSON OBJECT (not a string):
    {"samples": <the JSON array above>}

    Strict rules for the tool call:
    - Pass a JSON object, not a quoted string. Do NOT wrap the arguments in quotes or backticks.
    - Pass ONLY the samples array under the key "samples". Do NOT include labels or any extra arrays.
    - Do NOT reformat or alter the samples in any way.
    - Return one binary vote for EACH input sample, preserving the original order.
    - Do NOT return only the samples classified as attacks.
    - If the input has 5 samples, the final list MUST have exactly 5 values.
    - Output EXACTLY and ONLY what the tool returns (e.g., [0/1,...]).
  expected_output: >
    A list of exactly 5 binary votes (0 or 1), directly as returned by the tool.
  agent: cybersecurity_analyst_1

analyze_and_vote_2:
  description: >
    You are an AI agent independently analyzing the SAME 5 samples:
    {samples}

    Your job is ONLY to call the tool "Model" with arguments as a JSON OBJECT (not a string):
    {"samples": <the JSON array above>}

    Strict rules for the tool call:
    - Pass a JSON object, not a quoted string. Do NOT wrap the arguments in quotes or backticks.
    - Pass ONLY the samples array under the key "samples". Do NOT include labels or any extra arrays.
    - Do NOT modify the data in any way.
    - Return one binary vote for EACH input sample, preserving the original order.
    - Do NOT return only the samples classified as attacks.
    - If the input has 5 samples, the final list MUST have exactly 5 values.
    - Output EXACTLY the result from the tool.
  expected_output: >
    A list of exactly 5 binary votes (0 or 1), directly as returned by the tool.
  agent: cybersecurity_analyst_2


validate_results:
  description: >
    You are a senior cybersecurity specialist. You have received votes from two junior analysts on 5 data samples.
    - Analyst 1 votes: {analyze_and_vote_1.output}
    - Analyst 2 votes: {analyze_and_vote_2.output}

    BINARY PROBABILITY CONTEXT:
    ---
    {binary_probability_context}
    ---

    Your task is to analyze their votes and provide a final verdict.
    - If both analysts agree and the probability context has sufficient confidence, accept their consensus.
    - If confidence is below the configured threshold, keep the model vote in "predictions" but treat
      the sample as a rejection candidate for specialist review in your reasoning.
    - If analysts disagree, use the probability context to resolve the vote.
    - Return one final binary prediction for EACH original input sample, preserving order.
    - Do NOT return only attack samples. Normal samples must remain in the list as 0.
    - For a 5-sample batch, "predictions" MUST contain exactly 5 integers.
    - Respond STRICTLY in JSON with a key "predictions" containing ONLY the list of final binary votes.
    - Do not include any extra text outside of the JSON.

  expected_output: >
    ```json
    {
      "predictions": [0/1,...]
    }
    ```
  agent: cybersecurity_specialist
