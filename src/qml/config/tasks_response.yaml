generate_response_plan:
  description: >
    An attack of type '{attack_label}' has been detected.
    Provide a concise, step-by-step incident response plan.
    Structure the plan with the sections: "Immediate Actions," "Analysis and Containment," and "Eradication and Recovery."
    For each attack type, provide the most relevant and effective actions.

    Suggested actions for each attack type:
    - **Ransomware:** Isolate systems, disconnect from the network, DO NOT pay the ransom, activate the backup plan.
    - **DDoS (all types):** Contact your Internet Service Provider (ISP) or DDoS mitigation service, apply rate limiting, block malicious IPs.
    - **SQL Injection:** Isolate the application/database, revoke credentials, analyze logs for data leakage, fix the code with parameterized queries.
    - **XSS (Cross-Site Scripting):** Remove the malicious script, analyze logs for hijacked sessions, implement a Content Security Policy (CSP).
    - **MITM (Man-in-the-Middle):** Disconnect the compromised session, investigate the network for unauthorized devices, enforce the use of HTTPS/TLS and VPNs.
    - **Backdoor:** Isolate the system, perform a full forensic analysis, rebuild the system from a clean image, change all credentials.
    - **Password Attacks:** Block source IPs, force a password reset for all users, implement MFA and an account lockout policy.
    - **Reconnaissance (Fingerprinting, Port Scanning, Vulnerability Scanner):** Block source IPs, analyze target ports/services to understand the attacker's intent, close unnecessary ports.
    - **Uploading (Malicious):** Isolate the server, delete the file, scan the system for other payloads, implement strict upload validation.

  expected_output: >
    A clear markdown report detailing the response plan for the specified attack type. The report should be well-structured,
    easy to follow, and start with a title that identifies the attack.
  agent: incident_responder

